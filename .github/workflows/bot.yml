name: Vinted RL Sniper

on:
  schedule:
    - cron: "*/3 * * * *"   # every 3 minutes (safe + fast)
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        run: python bot.py

      # ✅ save updated seen_items.json
      - name: Commit seen items
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@example.com"
          git add seen_items.json
          git commit -m "update seen items" || echo "no changes"
          git push
